services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chillibek}
      POSTGRES_USER: ${POSTGRES_USER:-chillibek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in an env file or shell}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chillibek} -d ${POSTGRES_DB:-chillibek}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?set FLASK_SECRET_KEY in an env file or shell}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chillibek}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chillibek}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://chillibek.online,https://www.chillibek.online}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-memory://}
    expose:
      - "5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/menu', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chillibek}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chillibek}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  waf:
    build:
      context: .
      dockerfile: waf/Dockerfile
    restart: unless-stopped
    environment:
      WAF_UPSTREAM_BASE_URL: http://backend:5000
      WAF_LISTEN_HOST: 0.0.0.0
      WAF_LISTEN_PORT: 8080
      WAF_DASHBOARD_USERNAME: ${WAF_DASHBOARD_USERNAME:?set WAF_DASHBOARD_USERNAME in an env file or shell}
      WAF_DASHBOARD_PASSWORD_HASH: ${WAF_DASHBOARD_PASSWORD_HASH:?set WAF_DASHBOARD_PASSWORD_HASH in an env file or shell}
      WAF_DASHBOARD_SESSION_SECRET: ${WAF_DASHBOARD_SESSION_SECRET:?set WAF_DASHBOARD_SESSION_SECRET in an env file or shell}
      WAF_POLICY_PATH: /app/waf/local/policy.sqlite3
      WAF_SECURE_COOKIES: "true"
      FORWARDED_ALLOW_IPS: ${WAF_TRUSTED_PROXY_IPS:-127.0.0.1}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - waf-logs:/app/waf/logs
      - waf-policy:/app/waf/local
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  waf-logs:
  waf-policy:

networks:
  public:
  internal:
    internal: true
