<!DOCTYPE html>
<html data-api-base="https://kali.pythonanywhere.com/api" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Lounge - Панель управления</title>
    <link rel="stylesheet" href="./restaurant-admin.css">
</head>
<body>

    <div class="login-container" id="loginScreen">
        <h2>Вход в панель</h2>
        <input type="text" id="username" placeholder="Логин (admin)">
        <input type="password" id="password" placeholder="Пароль">
        <button data-action-click="a1">Войти</button>
        <div class="error-msg" id="loginError">Неверный логин или пароль</div>
    </div>

    <div class="admin-container" id="adminPanel">
        <div class="admin-header">
            <h2>Управление меню</h2>
            <div class="header-controls">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Поиск блюда..." data-action-input="a2">
                    <div class="search-results" id="searchResults"></div>
                </div>
                <button class="logout-btn" data-action-click="a3">Выйти</button>
            </div>
        </div>

        <div class="add-item-box">
            <h3 data-static-style="s1">Добавить новое блюдо</h3>
            <div class="error-msg" id="addError" data-static-style="s2"></div>
            <select id="newCat">
                <option value="breakfasts">🍳 Завтраки</option>
                <option value="salads">🥗 Салаты</option>
                <option value="soups">🍲 Супы</option>
                <option value="main">🥩 Горячие блюда</option>
                <option value="pizza">🍕 Пиццы</option>
                <option value="snacks">🍟 Закуски</option>
                <option value="drinks">🍹 Напитки</option>
            </select>
            <input type="text" id="newName" placeholder="Название (например: Стейк Рибай)">
            <input type="text" id="newDesc" placeholder="Состав (описание блюда)">
            <div class="flex-row">
                <input type="text" id="newWeight" placeholder="Граммовка (например: 300г)">
                <input type="number" id="newPrice" placeholder="Цена (₸)">
            </div>
            <input type="text" id="newImg" placeholder="Ссылка на фотографию (https://...)">
            <button data-action-click="a4">Добавить в меню</button>
        </div>

        <div id="menuCategoriesContainer"></div>
    </div>

    <div class="modal-overlay" id="editModal" data-action-click="a5">
        <div class="modal-content">
            <h3>Редактировать блюдо</h3>
            <input type="hidden" id="editId">
            <select id="editCat">
                <option value="breakfasts">🍳 Завтраки</option>
                <option value="salads">🥗 Салаты</option>
                <option value="soups">🍲 Супы</option>
                <option value="main">🥩 Горячие блюда</option>
                <option value="pizza">🍕 Пиццы</option>
                <option value="snacks">🍟 Закуски</option>
                <option value="drinks">🍹 Напитки</option>
            </select>
            <input type="text" id="editName" placeholder="Название">
            <input type="text" id="editDesc" placeholder="Состав">
            <div class="flex-row">
                <input type="text" id="editWeight" placeholder="Граммовка">
                <input type="number" id="editPrice" placeholder="Цена (₸)">
            </div>
            <input type="text" id="editImg" placeholder="Ссылка на фото">
            
            <div class="modal-actions">
                <button class="cancel-btn" data-action-click="a6">Отмена</button>
                <button data-action-click="a7">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="./restaurant-dom.js"></script>
    <script src="./restaurant-admin.js"></script>
</body>
</html>
